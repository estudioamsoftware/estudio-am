<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:'Instrument Sans',sans-serif;color:#14110F;background:radial-gradient(ellipse at 50% 35%,#D9862A 0%,#C8761A 45%,#A6600F 100%)}
.top{position:absolute;top:80px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px}

.dev{position:absolute;background:#14110F;box-shadow:0 40px 70px -25px rgba(40,20,0,.6)}
.dev img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.lap{left:170px;top:520px;width:740px;height:476px;border-radius:22px 22px 0 0;padding:16px 16px 18px}
.lap img{border-radius:6px}
.base{position:absolute;left:110px;top:996px;width:860px;height:30px;background:linear-gradient(#2b2622,#0d0b0a);border-radius:0 0 26px 26px;box-shadow:0 30px 50px -20px rgba(40,20,0,.6)}
.base:after{content:"";position:absolute;left:50%;top:0;width:130px;height:10px;margin-left:-65px;background:#3a332e;border-radius:0 0 10px 10px}
.tab{left:60px;top:690px;width:330px;height:440px;border-radius:30px;padding:16px}
.tab img{border-radius:14px}
.ph{left:800px;top:730px;width:210px;height:430px;border-radius:34px;padding:9px}
.ph img{border-radius:26px}
.sub{position:absolute;top:1190px;left:0;right:0;text-align:center;font-size:38px;font-weight:500;color:#2A1A08}
.url{position:absolute;top:1252px;left:0;right:0;text-align:center;font-weight:600;font-size:42px;color:#fff}
