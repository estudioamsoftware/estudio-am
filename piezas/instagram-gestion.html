<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,50,1;1,9..144,400..600,50,1&family=Instrument+Sans:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:'Instrument Sans',sans-serif;color:#14110F;background:linear-gradient(160deg,#F8F4EC 0%,#F2EADC 100%)}
.blob{position:absolute;right:-180px;top:-260px;width:620px;height:560px;border-radius:50%;background:#C8761A}
.brand{position:absolute;left:90px;top:90px;display:flex;align-items:center;gap:22px}
.brand .mark{height:62px;width:118px}
.brand b{display:block;font-family:'Fraunces',serif;font-weight:600;font-size:50px;line-height:1.05}
.brand i{font-style:normal;font-family:'Azeret Mono',monospace;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#756C64}
h1{position:absolute;left:86px;top:250px;font-family:'Fraunces',serif;font-weight:600;font-size:116px;line-height:1.0;letter-spacing:-.025em}
h1 span{color:#A6600F}
.left{position:absolute;left:90px;top:620px;width:450px}
.sub{font-size:38px;line-height:1.35;color:#3A332E}
.grid{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:30px 20px}
.ic{display:flex;align-items:center;gap:16px;font-size:32px;font-weight:600}
.ic svg{width:54px;height:54px;fill:none;stroke:#A6600F;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{margin-top:60px;display:inline-flex;align-items:center;gap:16px;background:#C8761A;color:#fff;font-weight:600;font-size:38px;padding:24px 44px;border-radius:999px}
.url{margin-top:22px;font-family:'Azeret Mono',monospace;font-size:24px;letter-spacing:.04em;color:#756C64}
.win{position:absolute;left:580px;top:520px;width:640px;border-radius:18px;overflow:hidden;background:#1d1916;box-shadow:0 40px 80px -30px rgba(20,17,15,.55),0 0 0 1px rgba(20,17,15,.15)}
.bar{height:38px;display:flex;align-items:center;gap:10px;padding-left:18px;background:#2a2521}
.bar i{width:13px;height:13px;border-radius:50%;background:#5a514a}
.win img{display:block;width:100%}
.tag{position:absolute;left:600px;top:1300px;font-family:'Azeret Mono',monospace;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#756C64}
</style></head><body>
